# S3 + CloudFrontによる静的サイト配信インフラ（dev-standards docs/static-hosting-pattern.md参照）。
# OSLS（`osls`パッケージ、Serverless Framework v3互換）でデプロイする。
#
#   cd infra && npx osls deploy
#
# デプロイにはAWS認証情報（AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY）が必要。
# 実際のデプロイ・CI/CDへの組み込みは別Issueで行う。
service: kingyo-hosting

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-northeast-1

resources:
  Resources:
    SiteBucket:
      Type: AWS::S3::Bucket
      Properties:
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    SiteBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref SiteBucket
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Sub "${SiteBucket.Arn}/*"
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

    SiteOriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: kingyo-site-oac
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    SiteDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          DefaultRootObject: index.html
          Origins:
            - Id: SiteBucketOrigin
              DomainName: !GetAtt SiteBucket.RegionalDomainName
              S3OriginConfig:
                OriginAccessIdentity: ""
              OriginAccessControlId: !Ref SiteOriginAccessControl
          DefaultCacheBehavior:
            TargetOriginId: SiteBucketOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # AWS managed: CachingOptimized
          # SPAのクライアントサイドルーティング向けに、S3の403/404を200のindex.htmlへフォールバックさせる
          CustomErrorResponses:
            - ErrorCode: 403
              ResponseCode: 200
              ResponsePagePath: /index.html
            - ErrorCode: 404
              ResponseCode: 200
              ResponsePagePath: /index.html

  Outputs:
    BucketName:
      Value: !Ref SiteBucket
    DistributionId:
      Value: !Ref SiteDistribution
    DistributionDomainName:
      Value: !GetAtt SiteDistribution.DomainName
