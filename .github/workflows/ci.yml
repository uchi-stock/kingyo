name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-ci.yml@v2.4.0
    with:
      workspaces: true
      node_version: 22
      skip_verification_on_push: true
      # frontend/src配下でdev-standards submoduleのshared/ui/*.cssをsymlink共有している
      # ため（sync-manifest.local.json）、CIのcheckoutでsubmoduleを取得する必要がある
      # （dev-standards docs参照。未取得のままbuildするとsymlinkの参照先が存在せず
      # ENOENTで失敗する）
      enable_standards_check: true
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
